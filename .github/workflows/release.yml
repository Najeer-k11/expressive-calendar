name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/attach the release to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ExpressiveCalendar-$TAG.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Expressive Calendar ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*

